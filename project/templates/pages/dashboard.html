<!doctype html>
<html lang="en"><head>

  <title>PyLearn - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
<div class="container py-4">
  <h2 class="mb-3">Student Dashboard</h2>

      <li class="list-group-item">Submitted “Loops and Conditions” — <span class="badge badge-soft">Passed</span></li>
