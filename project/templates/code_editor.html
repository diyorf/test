<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Code Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
    <link rel="stylesheet" href="/static/css/code_editor.css" />
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Interactive Python Code Editor</h1>
        <span class="badge text-bg-primary">Django + DRF</span>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <strong>Write Python Code</strong>
                </div>
                <div class="card-body">
                    <textarea id="code-editor">print("Hello, Python learner!")</textarea>
                    <div class="row g-2 mt-3">
                        <div class="col-md-6">
                            <label for="task-id" class="form-label">Task ID (optional for run, required for submit)</label>
                            <input id="task-id" type="number" min="1" class="form-control" placeholder="e.g. 1" />
                        </div>
                        <div class="col-md-6">
                            <label for="auth-token" class="form-label">Auth Token (required)</label>
                            <input id="auth-token" type="text" class="form-control" placeholder="Token xxxxx" />
                        </div>
                        <div class="col-12">
                            <label for="stdin" class="form-label">Standard Input (optional)</label>
                            <textarea id="stdin" class="form-control" rows="3" placeholder="Input lines passed to program..."></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-3">
                        <button id="run-btn" class="btn btn-success">Run Code</button>
                        <button id="submit-btn" class="btn btn-primary">Submit Solution</button>
                        <button id="clear-output-btn" class="btn btn-outline-secondary">Clear Output</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white"><strong>Status</strong></div>
                <div class="card-body">
                    <p class="mb-2"><strong>Last action:</strong> <span id="last-action">None</span></p>
                    <p class="mb-2"><strong>API status:</strong> <span id="api-status" class="badge text-bg-secondary">idle</span></p>
                    <p class="mb-0"><strong>Message:</strong> <span id="api-message">No requests yet.</span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white"><strong>Program Output</strong></div>
                <div class="card-body">
                    <pre id="output-panel" class="output-panel">Output will appear here...</pre>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white"><strong>Test Results</strong></div>
                <div class="card-body">
                    <table class="table table-sm align-middle mb-0" id="test-results-table">
                        <thead>
                        <tr>
                            <th>Submission ID</th>
                            <th>Status</th>
                            <th>Passed</th>
                            <th>Total</th>
                            <th>Score</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr><td colspan="5" class="text-muted">No test results yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="/static/js/code_editor.js"></script>
</body>
</html>
